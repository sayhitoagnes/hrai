<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong Arts Centre — Mid-Autumn Greeting Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      padding: 24px;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    img.card {
      width: min(540px, 100%);
      height: auto;
      display: block;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }

    .notes {
      max-width: 540px;
      margin-top: 18px;
      color: #999;
      font-size: 12px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <img
    class="card"
    src="assets/hkac-mid-autumn-greeting-card.jpg"
    alt="Hong Kong Arts Centre Mid-Autumn Festival greeting card"
  />
  <p class="notes">
    JPEG for sharing or print: <code>assets/hkac-mid-autumn-greeting-card.jpg</code>.
    The Hong Kong Arts Centre lockup sits at the bottom of the circular window,
    fully inside the disc.
  </p>
</body>
</html>
