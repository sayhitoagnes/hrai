<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong Arts Centre — Mid-Autumn Greeting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --cream: #fdf9f3;
      --ink: #1e2a3a;
      --navy: #2a3d56;
      --gold: #d4a84b;
      --gold-soft: #f3dfa8;
      --gold-glow: rgba(243, 223, 168, 0.55);
      --peach: #f8e8d8;
      --sky-top: #e8eef8;
      --sky-mid: #f5ebe0;
      --sky-bottom: #fdf6ec;
      --water: #f0e8dc;
      --slate: #5a6472;
      --horizon: rgba(212, 168, 75, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0ece6;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(540px, 100%);
      aspect-ratio: 4 / 5;
      background: var(--cream);
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(30, 42, 58, 0.08);
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .hero {
      position: relative;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 72%, var(--peach) 100%);
    }

    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 20%, rgba(255, 248, 230, 0.8) 0%, transparent 70%);
      pointer-events: none;
    }

    .reunion-ring {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 1px solid rgba(212, 168, 75, 0.2);
      pointer-events: none;
    }

    .reunion-ring--1 { width: 52%; aspect-ratio: 1; }
    .reunion-ring--2 { width: 64%; aspect-ratio: 1; opacity: 0.7; border-color: rgba(212, 168, 75, 0.14); }
    .reunion-ring--3 { width: 76%; aspect-ratio: 1; opacity: 0.45; border-color: rgba(212, 168, 75, 0.1); }

    .moon {
      position: absolute;
      top: 11%;
      left: 50%;
      transform: translateX(-50%);
      width: 30%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #fffef8 0%, var(--gold-soft) 42%, var(--gold) 92%);
      box-shadow:
        0 0 40px var(--gold-glow),
        0 0 80px rgba(243, 223, 168, 0.35);
      z-index: 2;
    }

    .horizon {
      position: absolute;
      left: 0;
      right: 0;
      top: 58%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--horizon), transparent);
      z-index: 3;
    }

    .moon-reflection {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translateX(-50%);
      width: 24%;
      height: 9%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(243, 223, 168, 0.45) 0%, transparent 72%);
      filter: blur(1px);
      z-index: 1;
    }

    .water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 42%;
      background: linear-gradient(180deg, transparent 0%, rgba(240, 232, 220, 0.5) 25%, var(--water) 100%);
    }

    .lanterns {
      position: absolute;
      bottom: 14%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 28px;
      align-items: flex-start;
      z-index: 4;
    }

    .lantern {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lantern-line {
      width: 1px;
      height: 14px;
      background: rgba(212, 168, 75, 0.45);
    }

    .lantern-body {
      width: 18px;
      height: 24px;
      border: 1px solid rgba(212, 168, 75, 0.65);
      border-radius: 40% 40% 45% 45% / 35% 35% 65% 65%;
      background: rgba(255, 248, 230, 0.7);
      box-shadow: 0 2px 12px rgba(212, 168, 75, 0.15);
    }

    .lantern--center .lantern-body {
      width: 22px;
      height: 28px;
      border-color: rgba(212, 168, 75, 0.8);
      background: rgba(255, 245, 220, 0.85);
    }

    .osmanthus {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0.35;
    }

    .osmanthus:nth-child(1) { top: 32%; left: 10%; }
    .osmanthus:nth-child(2) { top: 38%; left: 14%; opacity: 0.25; }
    .osmanthus:nth-child(3) { top: 35%; right: 12%; }
    .osmanthus:nth-child(4) { top: 42%; right: 16%; opacity: 0.25; }

    .brand-top {
      position: absolute;
      top: 6%;
      left: 8%;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 5;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 16px;
      height: auto;
    }

    .brand-mark svg path {
      fill: var(--white);
    }

    .brand-name {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
      line-height: 1.45;
    }

    .content {
      padding: 30px 8% 32px;
      background: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 30%;
    }

    .motif {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .motif-icon {
      width: 28px;
      height: 28px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .motif-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold-soft);
    }

    .divider {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .headline {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .subline {
      font-size: clamp(13px, 3vw, 15px);
      font-weight: 300;
      color: var(--slate);
      line-height: 1.7;
      max-width: 380px;
      letter-spacing: 0.01em;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #f0ebe4;
    }

    .footer-tag {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #a8adb6;
    }

    .footer-year {
      font-size: 11px;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.08em;
    }

    .notes {
      max-width: 540px;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .notes { display: none; }

      .card {
        box-shadow: none;
        width: 100%;
        max-width: 540px;
      }
    }
  </style>
</head>
<body>
  <div>
    <article class="card" role="img" aria-label="Hong Kong Arts Centre Mid-Autumn Festival greeting card">
      <section class="hero">
        <div class="sky" aria-hidden="true"></div>

        <div class="reunion-ring reunion-ring--1" aria-hidden="true"></div>
        <div class="reunion-ring reunion-ring--2" aria-hidden="true"></div>
        <div class="reunion-ring reunion-ring--3" aria-hidden="true"></div>

        <div class="moon" aria-hidden="true"></div>
        <div class="horizon" aria-hidden="true"></div>
        <div class="moon-reflection" aria-hidden="true"></div>
        <div class="water" aria-hidden="true"></div>

        <div class="osmanthus" aria-hidden="true"></div>
        <div class="osmanthus" aria-hidden="true"></div>
        <div class="osmanthus" aria-hidden="true"></div>
        <div class="osmanthus" aria-hidden="true"></div>

        <div class="lanterns" aria-hidden="true">
          <div class="lantern">
            <div class="lantern-line"></div>
            <div class="lantern-body"></div>
          </div>
          <div class="lantern lantern--center">
            <div class="lantern-line"></div>
            <div class="lantern-body"></div>
          </div>
          <div class="lantern">
            <div class="lantern-line"></div>
            <div class="lantern-body"></div>
          </div>
        </div>

        <header class="brand-top">
          <div class="brand-mark">
            <svg viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M18 8H34V64H18V8Z" />
              <path d="M34 8L66 64H48L34 36V8Z" />
            </svg>
          </div>
          <div class="brand-name">Hong Kong<br />Arts Centre</div>
        </header>
      </section>

      <section class="content">
        <div>
          <div class="motif" aria-hidden="true">
            <div class="motif-icon"></div>
            <div class="divider"></div>
          </div>
          <h1 class="headline">Happy Mid Autumn Festival</h1>
          <p class="subline">
            May the full moon brings us warmth, joy and togetherness
          </p>
        </div>

        <footer class="footer">
          <span class="footer-tag">Arts at the Centre</span>
          <span class="footer-year">2025</span>
        </footer>
      </section>
    </article>

    <p class="notes">
      Print at 540 × 675 px (4:5). Open in Chrome → Print → Save as PDF for email distribution.
    </p>
  </div>
</body>
</html>
