<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong Arts Centre — Mid-Autumn Greeting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --cream: #fdf9f3;
      --ink: #1e2a3a;
      --navy: #2a3d56;
      --gold: #d4a84b;
      --gold-soft: #f3dfa8;
      --gold-glow: rgba(243, 223, 168, 0.55);
      --peach: #f8e8d8;
      --sky-top: #e8eef8;
      --sky-mid: #f5ebe0;
      --sky-bottom: #fdf6ec;
      --water: #f0e8dc;
      --slate: #5a6472;
      --horizon: rgba(212, 168, 75, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8e4dc;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(900px, 100%);
      aspect-ratio: 16 / 9;
      background: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(30, 42, 58, 0.12);
      display: grid;
      grid-template-columns: 58% 42%;
    }

    /* ── Illustration panel ── */
    .illustration {
      position: relative;
      overflow: hidden;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 48%, var(--sky-bottom) 72%, var(--peach) 100%);
    }

    .sky::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 55% at 50% 22%, rgba(255, 248, 230, 0.75) 0%, transparent 68%);
      pointer-events: none;
    }

    .reunion-ring {
      position: absolute;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      border: 1px solid rgba(212, 168, 75, 0.2);
      pointer-events: none;
    }

    .reunion-ring--1 { width: 38%; aspect-ratio: 1; }
    .reunion-ring--2 { width: 48%; aspect-ratio: 1; opacity: 0.65; border-color: rgba(212, 168, 75, 0.14); }
    .reunion-ring--3 { width: 58%; aspect-ratio: 1; opacity: 0.4; border-color: rgba(212, 168, 75, 0.1); }

    .moon {
      position: absolute;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 28%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 34%, #fffef8 0%, var(--gold-soft) 42%, var(--gold) 92%);
      box-shadow: 0 0 36px var(--gold-glow), 0 0 72px rgba(243, 223, 168, 0.3);
      z-index: 2;
    }

    .horizon {
      position: absolute;
      left: 0;
      right: 0;
      top: 62%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--horizon), transparent);
      z-index: 3;
    }

    .moon-reflection {
      position: absolute;
      top: 64%;
      left: 50%;
      transform: translateX(-50%);
      width: 18%;
      height: 7%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(243, 223, 168, 0.45) 0%, transparent 72%);
      filter: blur(1px);
      z-index: 1;
    }

    .water {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38%;
      background: linear-gradient(180deg, transparent 0%, rgba(240, 232, 220, 0.5) 25%, var(--water) 100%);
    }

    .lanterns {
      position: absolute;
      bottom: 16%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 22px;
      align-items: flex-start;
      z-index: 4;
    }

    .lantern {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lantern-line {
      width: 1px;
      height: 12px;
      background: rgba(212, 168, 75, 0.45);
    }

    .lantern-body {
      width: 16px;
      height: 20px;
      border: 1px solid rgba(212, 168, 75, 0.65);
      border-radius: 40% 40% 45% 45% / 35% 35% 65% 65%;
      background: rgba(255, 248, 230, 0.7);
      box-shadow: 0 2px 10px rgba(212, 168, 75, 0.15);
    }

    .lantern--center .lantern-body {
      width: 18px;
      height: 24px;
      border-color: rgba(212, 168, 75, 0.8);
      background: rgba(255, 245, 220, 0.85);
    }

    .osmanthus-branch {
      position: absolute;
      width: 22%;
      opacity: 0.5;
      pointer-events: none;
      z-index: 2;
    }

    .osmanthus-branch--left { top: 18%; left: 2%; }
    .osmanthus-branch--right { top: 16%; right: 2%; transform: scaleX(-1); }

    .brand {
      position: absolute;
      top: 6%;
      left: 5%;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 6;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      background: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg { width: 17px; height: auto; }
    .brand-mark svg path { fill: var(--white); }

    .brand-name {
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
      line-height: 1.45;
    }

    /* ── Text panel ── */
    .text-panel {
      background: var(--cream);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 36px;
      position: relative;
    }

    .text-panel::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12%;
      bottom: 12%;
      width: 1px;
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
      opacity: 0.5;
    }

    .motif {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .motif-icon {
      width: 32px;
      height: 32px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .motif-icon::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--gold-soft);
    }

    .motif-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .headline {
      font-family: "Great Vibes", cursive;
      font-size: clamp(36px, 5.5vw, 52px);
      font-weight: 400;
      color: var(--ink);
      line-height: 1.15;
      margin-bottom: 20px;
      letter-spacing: 0.01em;
    }

    .subline {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(17px, 2.4vw, 22px);
      font-weight: 400;
      font-style: italic;
      color: var(--slate);
      line-height: 1.65;
      letter-spacing: 0.02em;
      max-width: 320px;
    }

    .notes {
      max-width: 900px;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    @media print {
      body { background: white; padding: 0; }
      .notes { display: none; }
      .card { box-shadow: none; width: 100%; max-width: 900px; }
    }
  </style>
</head>
<body>
  <div>
    <article class="card" role="img" aria-label="Hong Kong Arts Centre Mid-Autumn Festival greeting card">
      <section class="illustration">
        <div class="sky" aria-hidden="true"></div>

        <div class="reunion-ring reunion-ring--1" aria-hidden="true"></div>
        <div class="reunion-ring reunion-ring--2" aria-hidden="true"></div>
        <div class="reunion-ring reunion-ring--3" aria-hidden="true"></div>

        <div class="moon" aria-hidden="true"></div>
        <div class="horizon" aria-hidden="true"></div>
        <div class="moon-reflection" aria-hidden="true"></div>
        <div class="water" aria-hidden="true"></div>

        <svg class="osmanthus-branch osmanthus-branch--left" viewBox="0 0 120 100" fill="none" aria-hidden="true">
          <path d="M10 90 C30 70 25 40 50 25 C65 15 80 35 75 55 C70 70 55 82 40 88" stroke="#d4a84b" stroke-width="1" fill="none" opacity="0.6"/>
          <circle cx="42" cy="52" r="3.5" fill="#f3dfa8" opacity="0.7"/>
          <circle cx="55" cy="38" r="3" fill="#f3dfa8" opacity="0.65"/>
          <circle cx="68" cy="48" r="3.5" fill="#f3dfa8" opacity="0.6"/>
          <circle cx="48" cy="68" r="2.5" fill="#f3dfa8" opacity="0.55"/>
        </svg>
        <svg class="osmanthus-branch osmanthus-branch--right" viewBox="0 0 120 100" fill="none" aria-hidden="true">
          <path d="M10 90 C30 70 25 40 50 25 C65 15 80 35 75 55 C70 70 55 82 40 88" stroke="#d4a84b" stroke-width="1" fill="none" opacity="0.6"/>
          <circle cx="42" cy="52" r="3.5" fill="#f3dfa8" opacity="0.7"/>
          <circle cx="55" cy="38" r="3" fill="#f3dfa8" opacity="0.65"/>
          <circle cx="68" cy="48" r="3.5" fill="#f3dfa8" opacity="0.6"/>
          <circle cx="48" cy="68" r="2.5" fill="#f3dfa8" opacity="0.55"/>
        </svg>

        <div class="lanterns" aria-hidden="true">
          <div class="lantern">
            <div class="lantern-line"></div>
            <div class="lantern-body"></div>
          </div>
          <div class="lantern lantern--center">
            <div class="lantern-line"></div>
            <div class="lantern-body"></div>
          </div>
          <div class="lantern">
            <div class="lantern-line"></div>
            <div class="lantern-body"></div>
          </div>
        </div>

        <header class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M18 8H34V64H18V8Z" />
              <path d="M34 8L66 64H48L34 36V8Z" />
            </svg>
          </div>
          <div class="brand-name">Hong Kong<br />Arts Centre</div>
        </header>
      </section>

      <section class="text-panel">
        <div class="motif" aria-hidden="true">
          <div class="motif-icon"></div>
          <div class="motif-line"></div>
        </div>
        <h1 class="headline">Happy Mid Autumn Festival</h1>
        <p class="subline">May the full moon brings us warmth, joy and togetherness</p>
      </section>
    </article>

    <p class="notes">
      Print at 1600 × 900 px (16:9 landscape). Open in Chrome → Print → Save as PDF for email distribution.
    </p>
  </div>
</body>
</html>
