<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong Arts Centre — Mid-Autumn Greeting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --white: #ffffff;
      --off-white: #f7f7f5;
      --ink: #111111;
      --navy: #1a2233;
      --gold: #c9a24d;
      --gold-soft: #e8d5a8;
      --slate: #5c6470;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e6e6e4;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(540px, 100%);
      aspect-ratio: 4 / 5;
      background: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(17, 17, 17, 0.1);
      display: grid;
      grid-template-rows: 1fr auto;
    }

    .hero {
      position: relative;
      background: var(--navy);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #243048 0%, var(--navy) 55%, #121820 100%);
    }

    .triangle {
      position: absolute;
      width: 0;
      height: 0;
      border-style: solid;
      opacity: 0.9;
    }

    .triangle--1 {
      bottom: 18%;
      left: -8%;
      border-width: 0 0 180px 220px;
      border-color: transparent transparent var(--gold) transparent;
      opacity: 0.22;
    }

    .triangle--2 {
      top: 12%;
      right: -6%;
      border-width: 140px 160px 0 0;
      border-color: var(--gold-soft) transparent transparent transparent;
      opacity: 0.14;
    }

    .triangle--3 {
      bottom: 0;
      right: 18%;
      border-width: 0 90px 110px 0;
      border-color: transparent var(--white) transparent transparent;
      opacity: 0.06;
    }

    .moon {
      position: absolute;
      top: 14%;
      right: 12%;
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 32%, #fff8e8 0%, var(--gold-soft) 42%, var(--gold) 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .moon-cut {
      position: absolute;
      top: 22%;
      right: 6%;
      width: 34%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #1e2838;
    }

    .grid-line {
      position: absolute;
      background: rgba(255, 255, 255, 0.06);
    }

    .grid-line--h {
      left: 8%;
      right: 8%;
      height: 1px;
      top: 62%;
    }

    .grid-line--v {
      top: 10%;
      bottom: 10%;
      width: 1px;
      left: 38%;
    }

    .brand-top {
      position: absolute;
      top: 7%;
      left: 8%;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 16px;
      height: auto;
    }

    .brand-mark svg path {
      fill: var(--ink);
    }

    .brand-name {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.45;
    }

    .hero-copy {
      position: absolute;
      left: 8%;
      bottom: 10%;
      z-index: 2;
      max-width: 72%;
    }

    .hero-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold-soft);
      margin-bottom: 14px;
    }

    .hero-title {
      font-size: clamp(26px, 6.4vw, 34px);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--white);
    }

    .content {
      padding: 28px 8% 32px;
      background: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 28%;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: var(--gold);
      margin-bottom: 18px;
    }

    .subline {
      font-size: clamp(12px, 2.8vw, 14px);
      font-weight: 300;
      color: var(--slate);
      line-height: 1.7;
      max-width: 360px;
      letter-spacing: 0.01em;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #ececea;
    }

    .footer-tag {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9a9ea6;
    }

    .footer-year {
      font-size: 11px;
      font-weight: 400;
      color: var(--ink);
      letter-spacing: 0.08em;
    }

    .notes {
      max-width: 540px;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .notes { display: none; }

      .card {
        box-shadow: none;
        width: 100%;
        max-width: 540px;
      }
    }
  </style>
</head>
<body>
  <div>
    <article class="card" role="img" aria-label="Hong Kong Arts Centre Mid-Autumn Festival greeting card">
      <section class="hero">
        <div class="triangle triangle--1" aria-hidden="true"></div>
        <div class="triangle triangle--2" aria-hidden="true"></div>
        <div class="triangle triangle--3" aria-hidden="true"></div>
        <div class="grid-line grid-line--h" aria-hidden="true"></div>
        <div class="grid-line grid-line--v" aria-hidden="true"></div>

        <div class="moon" aria-hidden="true"></div>
        <div class="moon-cut" aria-hidden="true"></div>

        <header class="brand-top">
          <div class="brand-mark">
            <svg viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M18 8H34V64H18V8Z" />
              <path d="M34 8L66 64H48L34 36V8Z" />
            </svg>
          </div>
          <div class="brand-name">Hong Kong<br />Arts Centre</div>
        </header>

        <div class="hero-copy">
          <p class="hero-label">Mid-Autumn Festival</p>
          <h1 class="hero-title">Happy<br />Mid-Autumn<br />Festival</h1>
        </div>
      </section>

      <section class="content">
        <div>
          <div class="divider" aria-hidden="true"></div>
          <p class="subline">
            Wishing our colleagues warmth, unity, and a season filled with shared moments of joy.
          </p>
        </div>

        <footer class="footer">
          <span class="footer-tag">Arts at the Centre</span>
          <span class="footer-year">2025</span>
        </footer>
      </section>
    </article>

    <p class="notes">
      Print at 540 × 675 px (4:5). Open in Chrome → Print → Save as PDF for email distribution.
    </p>
  </div>
</body>
</html>
