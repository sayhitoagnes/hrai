<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong Arts Centre — Mid-Autumn Greeting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1c1c1c;
      --white: #ffffff;
      --moon-glow: #f5e6b8;
      --sky-deep: #0d3d4a;
      --sky-mid: #1a6b7a;
      --sky-warm: #c9952a;
      --bokeh-gold: rgba(255, 210, 90, 0.85);
      --bokeh-soft: rgba(255, 230, 150, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(540px, 100%);
      aspect-ratio: 4 / 5;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .brand {
      position: absolute;
      top: 6.5%;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: var(--white);
      z-index: 3;
    }

    .brand-name {
      font-size: clamp(11px, 2.6vw, 13px);
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.35;
      white-space: nowrap;
    }

    .brand-logo {
      width: clamp(52px, 12vw, 64px);
      height: auto;
      margin: 10px auto 0;
      display: block;
    }

    .portal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -46%);
      width: 78%;
      aspect-ratio: 1;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 28%, var(--sky-warm) 0%, var(--sky-mid) 38%, var(--sky-deep) 100%);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04);
    }

    .portal::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 22%, var(--bokeh-gold) 0%, transparent 18%),
        radial-gradient(circle at 72% 18%, var(--bokeh-soft) 0%, transparent 14%),
        radial-gradient(circle at 38% 12%, var(--bokeh-gold) 0%, transparent 12%),
        radial-gradient(circle at 85% 32%, var(--bokeh-soft) 0%, transparent 16%),
        radial-gradient(circle at 12% 48%, var(--bokeh-soft) 0%, transparent 10%),
        radial-gradient(circle at 58% 8%, rgba(255, 240, 180, 0.6) 0%, transparent 8%),
        radial-gradient(circle at 92% 55%, var(--bokeh-soft) 0%, transparent 12%);
      filter: blur(1px);
      opacity: 0.95;
    }

    .moon {
      position: absolute;
      top: 14%;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #fffef5 0%, var(--moon-glow) 45%, #d4b86a 100%);
      box-shadow:
        0 0 28px rgba(245, 230, 184, 0.55),
        0 0 60px rgba(245, 230, 184, 0.25);
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 50%;
    }

    .star:nth-child(1) { top: 22%; left: 24%; }
    .star:nth-child(2) { top: 18%; left: 68%; width: 3px; height: 3px; opacity: 0.9; }
    .star:nth-child(3) { top: 30%; left: 82%; opacity: 0.6; }
    .star:nth-child(4) { top: 34%; left: 14%; opacity: 0.55; }
    .star:nth-child(5) { top: 42%; left: 76%; opacity: 0.5; }
    .star:nth-child(6) { top: 48%; left: 20%; opacity: 0.45; }

    .osmanthus {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 18%;
      opacity: 0.22;
      background:
        radial-gradient(circle at 20% 70%, rgba(255, 220, 120, 0.8) 0 8%, transparent 9%),
        radial-gradient(circle at 35% 55%, rgba(255, 220, 120, 0.7) 0 7%, transparent 8%),
        radial-gradient(circle at 50% 65%, rgba(255, 220, 120, 0.75) 0 9%, transparent 10%),
        radial-gradient(circle at 65% 50%, rgba(255, 220, 120, 0.65) 0 7%, transparent 8%),
        radial-gradient(circle at 80% 68%, rgba(255, 220, 120, 0.7) 0 8%, transparent 9%);
      filter: blur(0.5px);
    }

    .headline {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      text-align: center;
      font-family: "Great Vibes", cursive;
      font-size: clamp(28px, 7.2vw, 42px);
      color: var(--white);
      line-height: 1.1;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25);
      z-index: 2;
      white-space: nowrap;
    }

    .subline {
      position: absolute;
      top: 67%;
      left: 50%;
      transform: translateX(-50%);
      width: 72%;
      text-align: center;
      font-size: clamp(9px, 2.1vw, 11px);
      font-weight: 400;
      line-height: 1.55;
      color: #1a1a1a;
      letter-spacing: 0.01em;
      z-index: 2;
    }

    .notes {
      max-width: 540px;
      margin-top: 20px;
      color: #bbb;
      font-size: 12px;
      line-height: 1.6;
      font-family: "Montserrat", sans-serif;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .notes {
        display: none;
      }

      .card {
        box-shadow: none;
        width: 100%;
        max-width: 540px;
      }
    }
  </style>
</head>
<body>
  <div>
    <article class="card" role="img" aria-label="Hong Kong Arts Centre Mid-Autumn Festival greeting card">
      <header class="brand">
        <div class="brand-name">Hong Kong<br />Arts Centre</div>
        <svg class="brand-logo" viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M18 8H34V64H18V8Z" fill="white" />
          <path d="M34 8L66 64H48L34 36V8Z" fill="white" />
        </svg>
      </header>

      <div class="portal">
        <div class="moon" aria-hidden="true"></div>
        <div class="stars" aria-hidden="true">
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
          <span class="star"></span>
        </div>
        <div class="osmanthus" aria-hidden="true"></div>
        <h1 class="headline">Happy Mid-Autumn Festival</h1>
        <p class="subline">Gathering Under the Moonlight,<br />Embracing Harmony Together.</p>
      </div>
    </article>

    <p class="notes">
      Print at 540 × 675 px (4:5) or scale proportionally for A5/A6. Open in Chrome and use Print → Save as PDF for email distribution.
    </p>
  </div>
</body>
</html>
