<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hong Kong Arts Centre — Mid-Autumn Greeting Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0f1a2e;
      --navy-mid: #162440;
      --gold: #c9a24d;
      --gold-light: #e4c878;
      --gold-text: #d4b06a;
      --teal: #3d7a8c;
      --teal-soft: #5a9aaa;
      --violet: #6b5b8a;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      padding: 24px;
    }

    .card {
      width: min(540px, 100%);
      aspect-ratio: 4 / 5;
      background: var(--navy);
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
    }

    .frame {
      position: absolute;
      inset: 20px;
      border: 1px solid var(--gold);
      pointer-events: none;
      z-index: 4;
    }

    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 5;
      opacity: 0.9;
    }

    .corner--tl { top: 20px; left: 20px; }
    .corner--tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner--bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner--br { bottom: 20px; right: 20px; transform: scale(-1); }

    .brand {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 6;
    }

    .brand-mark svg {
      width: 36px;
      height: auto;
    }

    .brand-name {
      font-family: "Inter", sans-serif;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      line-height: 1.45;
    }

    .medallion-wrap {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: 62%;
      aspect-ratio: 1;
      z-index: 2;
    }

    .medallion-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid #1a2840;
      background: radial-gradient(circle at 50% 35%, #1e3050 0%, #142238 55%, #0d1828 100%);
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(201, 162, 77, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .medallion-art {
      width: 88%;
      height: 88%;
    }

    .message {
      position: absolute;
      bottom: 11%;
      left: 50%;
      transform: translateX(-50%);
      width: 78%;
      text-align: center;
      z-index: 6;
    }

    .headline {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-text);
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .subline {
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      font-size: clamp(13px, 3.2vw, 16px);
      font-weight: 400;
      font-style: italic;
      color: rgba(212, 176, 106, 0.88);
      line-height: 1.65;
      letter-spacing: 0.03em;
      max-width: 340px;
      margin: 0 auto;
    }

    .notes {
      max-width: 540px;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.6;
      font-family: "Inter", sans-serif;
    }

    @media print {
      body { background: white; padding: 0; }
      .notes { display: none; }
      .card { box-shadow: none; width: 100%; max-width: 540px; }
    }
  </style>
</head>
<body>
  <div>
    <article class="card" role="img" aria-label="Hong Kong Arts Centre Mid-Autumn Festival greeting card">
      <div class="frame" aria-hidden="true"></div>

      <svg class="corner corner--tl" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M1 1H12V3H3V12H1V1Z" stroke="#c9a24d" stroke-width="0.8" fill="none"/>
        <path d="M1 1L8 8M1 5L5 1M5 5L1 1" stroke="#c9a24d" stroke-width="0.5" opacity="0.7"/>
        <rect x="1" y="1" width="4" height="4" stroke="#c9a24d" stroke-width="0.5" fill="none"/>
        <path d="M6 1H10V2H6V1ZM1 6H2V10H1V6Z" stroke="#c9a24d" stroke-width="0.4" fill="none"/>
      </svg>
      <svg class="corner corner--tr" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M1 1H12V3H3V12H1V1Z" stroke="#c9a24d" stroke-width="0.8" fill="none"/>
        <path d="M1 1L8 8M1 5L5 1M5 5L1 1" stroke="#c9a24d" stroke-width="0.5" opacity="0.7"/>
        <rect x="1" y="1" width="4" height="4" stroke="#c9a24d" stroke-width="0.5" fill="none"/>
        <path d="M6 1H10V2H6V1ZM1 6H2V10H1V6Z" stroke="#c9a24d" stroke-width="0.4" fill="none"/>
      </svg>
      <svg class="corner corner--bl" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M1 1H12V3H3V12H1V1Z" stroke="#c9a24d" stroke-width="0.8" fill="none"/>
        <path d="M1 1L8 8M1 5L5 1M5 5L1 1" stroke="#c9a24d" stroke-width="0.5" opacity="0.7"/>
        <rect x="1" y="1" width="4" height="4" stroke="#c9a24d" stroke-width="0.5" fill="none"/>
        <path d="M6 1H10V2H6V1ZM1 6H2V10H1V6Z" stroke="#c9a24d" stroke-width="0.4" fill="none"/>
      </svg>
      <svg class="corner corner--br" viewBox="0 0 28 28" fill="none" aria-hidden="true">
        <path d="M1 1H12V3H3V12H1V1Z" stroke="#c9a24d" stroke-width="0.8" fill="none"/>
        <path d="M1 1L8 8M1 5L5 1M5 5L1 1" stroke="#c9a24d" stroke-width="0.5" opacity="0.7"/>
        <rect x="1" y="1" width="4" height="4" stroke="#c9a24d" stroke-width="0.5" fill="none"/>
        <path d="M6 1H10V2H6V1ZM1 6H2V10H1V6Z" stroke="#c9a24d" stroke-width="0.4" fill="none"/>
      </svg>

      <header class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 80 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M18 8H34V64H18V8Z" fill="white" />
            <path d="M34 8L66 64H48L34 36V8Z" fill="white" />
          </svg>
        </div>
        <div class="brand-name">Hong Kong<br />Arts Centre</div>
      </header>

      <div class="medallion-wrap" aria-hidden="true">
        <div class="medallion-ring">
          <svg class="medallion-art" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="moonGrad" cx="40%" cy="35%">
                <stop offset="0%" stop-color="#f0dfa0"/>
                <stop offset="50%" stop-color="#d4b06a"/>
                <stop offset="100%" stop-color="#a8843a"/>
              </radialGradient>
              <filter id="birdGlow">
                <feGaussianBlur stdDeviation="2" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>

            <!-- Floral left -->
            <path d="M30 120 Q20 90 35 70 Q50 55 65 75 Q55 95 45 110 Q38 118 30 120Z" fill="#3d7a8c" stroke="#c9a24d" stroke-width="0.8" opacity="0.85"/>
            <path d="M25 105 Q15 85 30 80 Q40 78 42 95 Q35 102 25 105Z" fill="#5a9aaa" stroke="#c9a24d" stroke-width="0.6" opacity="0.7"/>
            <path d="M40 130 Q30 115 45 105 Q55 100 58 115 Q50 125 40 130Z" fill="#6b5b8a" stroke="#c9a24d" stroke-width="0.6" opacity="0.65"/>
            <circle cx="38" cy="88" r="3" fill="#c9a24d" opacity="0.6"/>

            <!-- Floral right -->
            <path d="M170 120 Q180 90 165 70 Q150 55 135 75 Q145 95 155 110 Q162 118 170 120Z" fill="#3d7a8c" stroke="#c9a24d" stroke-width="0.8" opacity="0.85"/>
            <path d="M175 105 Q185 85 170 80 Q160 78 158 95 Q165 102 175 105Z" fill="#5a9aaa" stroke="#c9a24d" stroke-width="0.6" opacity="0.7"/>
            <path d="M160 130 Q170 115 155 105 Q145 100 142 115 Q150 125 160 130Z" fill="#6b5b8a" stroke="#c9a24d" stroke-width="0.6" opacity="0.65"/>
            <circle cx="162" cy="88" r="3" fill="#c9a24d" opacity="0.6"/>

            <!-- Horizon band -->
            <rect x="20" y="108" width="160" height="18" rx="2" fill="#0d1828" opacity="0.6"/>

            <!-- Moon -->
            <circle cx="100" cy="72" r="38" fill="url(#moonGrad)"/>
            <circle cx="88" cy="62" r="4" fill="#f0dfa0" opacity="0.3"/>
            <circle cx="108" cy="78" r="3" fill="#a8843a" opacity="0.25"/>

            <!-- Birds -->
            <path d="M72 48 Q76 44 80 48 Q76 50 72 48Z" fill="white" filter="url(#birdGlow)" opacity="0.9"/>
            <path d="M120 44 Q124 40 128 44 Q124 46 120 44Z" fill="white" filter="url(#birdGlow)" opacity="0.9"/>

            <!-- Rabbit left -->
            <ellipse cx="72" cy="148" rx="14" ry="16" fill="#c9a24d" opacity="0.9"/>
            <ellipse cx="66" cy="130" rx="4" ry="10" fill="#c9a24d" opacity="0.9"/>
            <ellipse cx="78" cy="130" rx="4" ry="10" fill="#c9a24d" opacity="0.9"/>
            <circle cx="72" cy="144" r="2" fill="#0d1828" opacity="0.5"/>

            <!-- Rabbit right -->
            <ellipse cx="128" cy="148" rx="14" ry="16" fill="#c9a24d" opacity="0.9"/>
            <ellipse cx="122" cy="130" rx="4" ry="10" fill="#c9a24d" opacity="0.9"/>
            <ellipse cx="134" cy="130" rx="4" ry="10" fill="#c9a24d" opacity="0.9"/>
            <circle cx="128" cy="144" r="2" fill="#0d1828" opacity="0.5"/>
          </svg>
        </div>
      </div>

      <section class="message">
        <h1 class="headline">Happy Mid Autumn Festival</h1>
        <p class="subline">May the full moon brings us warmth, joy and togetherness</p>
      </section>
    </article>

    <p class="notes">
      Print at 540 × 675 px (4:5). Open in Chrome → Print → Save as PDF for email distribution.
    </p>
  </div>
</body>
</html>
