<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Chat box</title>
  <style>
    :root {
      --pink: #e91e8c;
      --pink-dark: #c2186e;
      --pink-soft: #fce4f0;
      --pink-wash: #fff5fa;
      --ink: #2a1f24;
      --muted: #6b5560;
      --line: #f0d4e3;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #ffd6ea 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #f8c8de 0%, transparent 50%),
        linear-gradient(160deg, #fff8fb 0%, #ffeef6 45%, #fff5fa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: min(560px, 100%);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(233, 30, 140, 0.12);
      display: flex;
      flex-direction: column;
      min-height: 640px;
      max-height: min(860px, 92vh);
    }

    header {
      background: linear-gradient(135deg, var(--pink) 0%, #f062a8 100%);
      color: var(--white);
      padding: 18px 20px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .header-link {
      display: inline-block;
      margin-top: 10px;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--pink-wash);
    }

    .bubble {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--white);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--pink);
      color: var(--white);
      border-bottom-right-radius: 6px;
    }

    .source {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
    }

    a.source:hover { text-decoration: underline; }

    .composer {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--white);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    #question {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
    }

    #question:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(233, 30, 140, 0.15);
    }

    button {
      font: inherit;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      padding: 12px 16px;
      font-weight: 600;
    }

    #askBtn {
      background: var(--pink);
      color: var(--white);
      min-width: 72px;
    }

    #askBtn:hover { background: var(--pink-dark); }

    #contactHr {
      background: #f3f3f3;
      color: #9a9a9a;
      cursor: not-allowed;
      border: 1px dashed #cfcfcf;
      align-self: flex-start;
    }

    .hint {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hint a { color: var(--pink-dark); }
  </style>
</head>
<body>
  <main class="app" aria-label="HR Chat box">
    <header>
      <h1>HR Chat box</h1>
      <p>Ask about policies, benefits, workplace guidelines, or Cap. 57.</p>
      <a class="header-link" href="https://www.elegislation.gov.hk/hk/cap57" target="_blank" rel="noopener noreferrer">
        Open Employment Ordinance (Cap. 57)
      </a>
    </header>

    <div id="messages" role="log" aria-live="polite"></div>

    <div class="composer">
      <button id="contactHr" type="button" disabled title="Coming next">
        Contact HR (coming next)
      </button>
      <div class="row">
        <textarea id="question" rows="2" placeholder="Try: What is statutory annual leave under Cap. 57?" aria-label="Your question"></textarea>
        <button id="askBtn" type="button">Ask</button>
      </div>
      <p class="hint">
        Cap. 57 answers are short summaries linked to
        <a href="https://www.elegislation.gov.hk/hk/cap57" target="_blank" rel="noopener noreferrer">elegislation.gov.hk</a>.
        Not legal advice. No login. Personal leave balances are not available in this build.
      </p>
    </div>
  </main>

  <script>
    const CAP57_URL = "https://www.elegislation.gov.hk/hk/cap57";

    const knowledge = [
      {
        id: 1,
        topic: "Typhoon / Signal 8",
        triggers: ["signal 8", "signal no. 8", "typhoon", "report to the office", "report to office", "wfh today", "work from home today"],
        answer: "Office staff should work remotely when Signal No. 8 is active.",
        source: "Disaster Protocol"
      },
      {
        id: 2,
        topic: "Annual leave basics",
        triggers: ["annual leave", "how many days", "vacation days", "leave days"],
        answer: "Full-time staff receive 15 days of annual leave per year.",
        source: "Leave Policy"
      },
      {
        id: 3,
        topic: "Sick leave",
        triggers: ["sick leave", "medical certificate", "medical leave"],
        answer: "Staff may take sick leave with a medical certificate when required.",
        source: "Leave Policy"
      },
      {
        id: 4,
        topic: "Health insurance",
        triggers: ["health insurance", "medical plan", "medical coverage"],
        answer: "Enrolled staff are covered by the company health plan; details are in the benefits guide.",
        source: "Benefits Guide"
      },
      {
        id: 5,
        topic: "Remote work",
        triggers: ["remote work", "work from home policy", "wfh policy"],
        answer: "Remote work follows the published remote-work guidelines and manager approval rules.",
        source: "Remote Work Guidelines"
      },
      {
        id: 6,
        topic: "Expense claim",
        triggers: ["expense", "reimbursement", "claim expense"],
        answer: "Submit expense claims through the standard reimbursement process with receipts.",
        source: "Benefits Guide"
      },
      {
        id: 7,
        topic: "Code of conduct",
        triggers: ["code of conduct", "workplace rules", "employee handbook"],
        answer: "Staff must follow the code of conduct in the employee handbook.",
        source: "Employee Handbook"
      },
      {
        id: 101,
        topic: "Employment Ordinance overview",
        category: "cap57",
        triggers: ["what is the employment ordinance", "what is cap 57", "what is cap. 57", "explain the employment ordinance", "employment ordinance of hk", "employment ordinance of hong kong", "hong kong employment law", "hk employment law"],
        answer: "The Employment Ordinance (Cap. 57) is Hong Kong’s main employment statute. It sets minimum rules on wages, rest days, holidays, leave, and termination for employees. This chat gives short summaries only — always check the official text for the exact wording.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 102,
        topic: "Continuous contract",
        category: "cap57",
        triggers: ["continuous contract", "18 hours", "4 weeks", "continuous employment"],
        answer: "Under Cap. 57, an employee usually counts as being under a continuous contract if they have worked for the same employer for 4 or more consecutive weeks and at least 18 hours in each of those weeks. Continuous-contract employees get extra statutory benefits such as rest days, paid annual leave, and sickness allowance.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 103,
        topic: "Rest days",
        category: "cap57",
        triggers: ["rest day", "rest days", "one day off", "day off every week", "weekly rest"],
        answer: "Under Cap. 57, an employee employed under a continuous contract is entitled to at least 1 rest day in every period of 7 days. A rest day is a continuous period of not less than 24 hours during which the employee is entitled to abstain from working.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 104,
        topic: "Statutory annual leave",
        category: "cap57",
        triggers: ["statutory annual leave", "paid annual leave under", "cap 57 annual leave", "employment ordinance annual leave", "statutory leave", "how many annual leave under law", "legal annual leave"],
        answer: "Under Cap. 57, after 12 months under a continuous contract, an employee is entitled to paid annual leave starting at 7 days, rising with length of service up to a maximum of 14 days (from the 9th year onward). Company policy can be more generous than this legal minimum.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 105,
        topic: "Sickness allowance",
        category: "cap57",
        triggers: ["sickness allowance", "paid sick leave", "statutory sick", "4 consecutive days", "sick leave pay", "cap 57 sick"],
        answer: "Under Cap. 57, continuous-contract employees can accumulate paid sickness days (2 per month in the first 12 months, then 4 per month, up to 120 days). Sickness allowance is generally payable for sick leave of at least 4 consecutive days supported by a medical certificate, usually at 4/5 of average daily wages.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 106,
        topic: "Maternity leave",
        category: "cap57",
        triggers: ["maternity leave", "pregnancy leave", "14 weeks", "maternity pay"],
        answer: "Under Cap. 57, an eligible female employee under a continuous contract is entitled to 14 weeks of maternity leave. Maternity leave pay is generally 4/5 of average daily wages, with a statutory cap applying to part of the leave period. Check Cap. 57 for eligibility details.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 107,
        topic: "Paternity leave",
        category: "cap57",
        triggers: ["paternity leave", "father leave", "paternity pay"],
        answer: "Under Cap. 57, an eligible male employee under a continuous contract may take paternity leave in connection with the birth of his child. Check Cap. 57 for the current number of days, notice rules, and pay conditions.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 108,
        topic: "Statutory holidays",
        category: "cap57",
        triggers: ["statutory holiday", "statutory holidays", "public holiday pay", "holiday entitlement under law"],
        answer: "Cap. 57 provides for statutory holidays. Employees covered by the Ordinance are entitled to statutory holidays, and continuous-contract employees may also be entitled to holiday pay subject to the Ordinance’s conditions. Company holiday calendars should not fall below the legal minimum.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 109,
        topic: "Wages and payday",
        category: "cap57",
        triggers: ["wage period", "when must wages be paid", "payday law", "payment of wages", "unpaid wages", "wage payment"],
        answer: "Under Cap. 57, wages must generally be paid as soon as practicable after the end of the wage period, and in any case not later than 7 days after that period ends. Deductions from wages are tightly restricted by the Ordinance.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 110,
        topic: "Termination notice",
        category: "cap57",
        triggers: ["termination notice", "notice period", "resignation notice", "payment in lieu of notice", "dismiss", "termination of employment"],
        answer: "Cap. 57 sets rules on termination by notice or payment in lieu of notice. The required notice depends on the contract and whether the employee is still in probation. Summary dismissal and constructive dismissal have separate legal tests — read Cap. 57 and seek advice for a real case.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      },
      {
        id: 111,
        topic: "Severance and long service",
        category: "cap57",
        triggers: ["severance payment", "long service payment", "redundancy", "lsp", "severance"],
        answer: "Under Cap. 57, eligible employees may be entitled to a severance payment (for example on redundancy) or a long service payment after longer service, subject to qualifying conditions. Amounts and offsets are set by the Ordinance — use the official Cap. 57 text for calculations.",
        source: "Employment Ordinance Cap. 57",
        sourceUrl: CAP57_URL
      }
    ];

    const messagesEl = document.getElementById("messages");
    const questionEl = document.getElementById("question");
    const askBtn = document.getElementById("askBtn");

    function wantsCap57(q) {
      return /(employment ordinance|cap\.?\s*57|chapter\s*57|statutory|hong kong law|hk law|labour law|labor law)/i.test(q);
    }

    function findAnswer(raw) {
      const q = raw.toLowerCase().trim();
      const preferCap57 = wantsCap57(q);
      let best = null;
      let bestScore = 0;
      for (const item of knowledge) {
        let score = 0;
        for (const trigger of item.triggers) {
          if (q.includes(trigger)) score += trigger.length;
        }
        if (preferCap57 && item.category === "cap57" && score > 0) score += 50;
        if (score > bestScore) {
          bestScore = score;
          best = item;
        }
      }
      return best;
    }

    function addBubble(text, role, source, sourceUrl) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.appendChild(document.createTextNode(text));
      if (source) {
        bubble.appendChild(document.createElement("br"));
        if (sourceUrl) {
          const link = document.createElement("a");
          link.className = "source";
          link.href = sourceUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Source: " + source;
          bubble.appendChild(link);
        } else {
          const tag = document.createElement("div");
          tag.className = "source";
          tag.textContent = "Source: " + source;
          bubble.appendChild(tag);
        }
      }
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function ask() {
      const text = questionEl.value.trim();
      if (!text) return;

      addBubble(text, "user");
      questionEl.value = "";

      const match = findAnswer(text);
      if (match) {
        addBubble(match.answer, "bot", match.source, match.sourceUrl);
      } else {
        addBubble(
          "I don't know based on the sample knowledge in this build. For Hong Kong employment law, you can also open the Employment Ordinance (Cap. 57).",
          "bot",
          "Employment Ordinance Cap. 57",
          CAP57_URL
        );
      }
    }

    addBubble(
      "Hi! I can answer sample company-policy questions and common Hong Kong Employment Ordinance (Cap. 57) questions. Cap. 57 answers include a link to the official text.",
      "bot"
    );

    askBtn.addEventListener("click", ask);
    questionEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ask();
      }
    });
  </script>
</body>
</html>
