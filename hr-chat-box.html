<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Chat box</title>
  <style>
    :root {
      --pink: #e91e8c;
      --pink-dark: #c2186e;
      --pink-soft: #fce4f0;
      --pink-wash: #fff5fa;
      --ink: #2a1f24;
      --muted: #6b5560;
      --line: #f0d4e3;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #ffd6ea 0%, transparent 55%),
        radial-gradient(ellipse 60% 40% at 100% 100%, #f8c8de 0%, transparent 50%),
        linear-gradient(160deg, #fff8fb 0%, #ffeef6 45%, #fff5fa 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: min(560px, 100%);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(233, 30, 140, 0.12);
      display: flex;
      flex-direction: column;
      min-height: 640px;
      max-height: min(860px, 92vh);
    }

    header {
      background: linear-gradient(135deg, var(--pink) 0%, #f062a8 100%);
      color: var(--white);
      padding: 18px 20px 16px;
    }

    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      opacity: 0.95;
    }

    .header-link {
      display: inline-block;
      margin-top: 10px;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--pink-wash);
    }

    .bubble {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.45;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--white);
      border: 1px solid var(--line);
      border-bottom-left-radius: 6px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--pink);
      color: var(--white);
      border-bottom-right-radius: 6px;
    }

    .source {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--pink-soft);
      color: var(--pink-dark);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
    }

    a.source:hover { text-decoration: underline; }

    .composer {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--line);
      background: var(--white);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    #question {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
    }

    #question:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(233, 30, 140, 0.15);
    }

    button {
      font: inherit;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      padding: 12px 16px;
      font-weight: 600;
    }

    #askBtn {
      background: var(--pink);
      color: var(--white);
      min-width: 72px;
    }

    #askBtn:hover { background: var(--pink-dark); }

    #contactHr {
      background: #f3f3f3;
      color: #9a9a9a;
      cursor: not-allowed;
      border: 1px dashed #cfcfcf;
      align-self: flex-start;
    }

    .hint {
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hint a { color: var(--pink-dark); }
  </style>
</head>
<body>
  <main class="app" aria-label="HR Chat box">
    <header>
      <h1>HR Chat box</h1>
      <p>Ask about policies, benefits, workplace guidelines, or Cap. 57.</p>
      <a class="header-link" href="https://www.elegislation.gov.hk/hk/cap57" target="_blank" rel="noopener noreferrer">
        Open Employment Ordinance (Cap. 57)
      </a>
    </header>

    <div id="messages" role="log" aria-live="polite"></div>

    <div class="composer">
      <button id="contactHr" type="button" disabled title="Coming next">
        Contact HR (coming next)
      </button>
      <div class="row">
        <textarea id="question" rows="2" placeholder="Try: What is statutory annual leave under Cap. 57?" aria-label="Your question"></textarea>
        <button id="askBtn" type="button">Ask</button>
      </div>
      <p class="hint">
        Cap. 57 answers are short summaries linked to
        <a href="https://www.elegislation.gov.hk/hk/cap57" target="_blank" rel="noopener noreferrer">elegislation.gov.hk</a>.
        Not legal advice. No login. Personal leave balances are not available in this build.
      </p>
    </div>
  </main>

  <script>
    const CAP57_URL = "https://www.elegislation.gov.hk/hk/cap57";

    const knowledge = [
  {
    "id": 1,
    "topic": "Typhoon / Signal 8",
    "triggers": [
      "signal 8",
      "signal no. 8",
      "typhoon",
      "report to the office",
      "report to office",
      "wfh today",
      "work from home today"
    ],
    "answer": "Office staff should work remotely when Signal No. 8 is active.",
    "source": "Disaster Protocol"
  },
  {
    "id": 2,
    "topic": "Annual leave basics",
    "triggers": [
      "annual leave",
      "how many days",
      "vacation days",
      "leave days"
    ],
    "answer": "Full-time staff receive 15 days of annual leave per year.",
    "source": "Leave Policy"
  },
  {
    "id": 3,
    "topic": "Sick leave",
    "triggers": [
      "sick leave",
      "medical certificate",
      "medical leave"
    ],
    "answer": "Staff may take sick leave with a medical certificate when required.",
    "source": "Leave Policy"
  },
  {
    "id": 4,
    "topic": "Health insurance",
    "triggers": [
      "health insurance",
      "medical plan",
      "medical coverage"
    ],
    "answer": "Enrolled staff are covered by the company health plan; details are in the benefits guide.",
    "source": "Benefits Guide"
  },
  {
    "id": 5,
    "topic": "Remote work",
    "triggers": [
      "remote work",
      "work from home policy",
      "wfh policy"
    ],
    "answer": "Remote work follows the published remote-work guidelines and manager approval rules.",
    "source": "Remote Work Guidelines"
  },
  {
    "id": 6,
    "topic": "Expense claim",
    "triggers": [
      "expense",
      "reimbursement",
      "claim expense"
    ],
    "answer": "Submit expense claims through the standard reimbursement process with receipts.",
    "source": "Benefits Guide"
  },
  {
    "id": 7,
    "topic": "Code of conduct",
    "triggers": [
      "code of conduct",
      "workplace rules",
      "employee handbook"
    ],
    "answer": "Staff must follow the code of conduct in the employee handbook.",
    "source": "Employee Handbook"
  },
  {
    "id": 101,
    "topic": "Employment Ordinance overview",
    "category": "cap57",
    "triggers": [
      "what is the employment ordinance",
      "what is cap 57",
      "what is cap. 57",
      "explain the employment ordinance",
      "employment ordinance of hk",
      "employment ordinance of hong kong",
      "hong kong employment law",
      "hk employment law"
    ],
    "answer": "Cap. 57 is Hong Kong’s main employment law. For continuous-contract employees it sets concrete minimums such as: at least 1 rest day every 7 days; paid annual leave of 7–14 days after each 12 months of service; sickness allowance for absences of 4+ consecutive days (usually 4/5 of average daily wages); 14 weeks’ maternity leave; 5 days’ paternity leave; statutory holidays; and wage payment within 7 days after the wage period ends.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 102,
    "topic": "Continuous contract",
    "category": "cap57",
    "triggers": [
      "continuous contract",
      "18 hours",
      "4 weeks",
      "continuous employment"
    ],
    "answer": "You are usually under a continuous contract if you worked for the same employer for 4 consecutive weeks or more, and at least 18 hours in each of those weeks. That status unlocks rest days, paid annual leave, sickness allowance, holiday pay (after 3 months), and other Cap. 57 benefits.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 103,
    "topic": "Rest days",
    "category": "cap57",
    "triggers": [
      "rest day",
      "rest days",
      "one day off",
      "day off every week",
      "weekly rest"
    ],
    "answer": "If you are under a continuous contract, you must get at least 1 rest day in every 7-day period. A rest day is a continuous 24-hour period when you are entitled not to work. Your employer should appoint rest days; if they are not fixed in advance, they should be notified before the start of each week.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 104,
    "topic": "Statutory annual leave",
    "category": "cap57",
    "triggers": [
      "statutory annual leave",
      "paid annual leave under",
      "cap 57 annual leave",
      "employment ordinance annual leave",
      "statutory leave",
      "how many annual leave under law",
      "legal annual leave",
      "annual leave entitlement under",
      "how many days of annual leave"
    ],
    "answer": "After every 12 months under a continuous contract, paid annual leave is: Year 1–2 = 7 days; Year 3 = 8; Year 4 = 9; Year 5 = 10; Year 6 = 11; Year 7 = 12; Year 8 = 13; Year 9+ = 14 days. Leave timing is set by the employer after consulting you, with written notice at least 14 days in advance unless you agree to shorter notice. Pay is your average daily wage over the previous 12 months (or shorter period if employed for less than 12 months). If your contract ends after 3 months but before 12 months in a leave year (except summary dismissal), you get pro-rata annual leave pay.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 105,
    "topic": "Sickness allowance",
    "category": "cap57",
    "triggers": [
      "sickness allowance",
      "paid sick leave",
      "statutory sick",
      "4 consecutive days",
      "sick leave pay",
      "cap 57 sick"
    ],
    "answer": "Under a continuous contract you accumulate paid sickness days at 2 days per month for the first 12 months, then 4 days per month, up to a maximum of 120 days. Sickness allowance is payable when you take at least 4 consecutive sickness days supported by a medical certificate. The daily rate is usually 4/5 of your average daily wages.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 106,
    "topic": "Maternity leave",
    "category": "cap57",
    "triggers": [
      "maternity leave",
      "pregnancy leave",
      "14 weeks",
      "maternity pay"
    ],
    "answer": "An eligible female employee under a continuous contract gets 14 continuous weeks of maternity leave. If the baby arrives later than the expected date, extra days equal to that delay are added. Up to 4 more weeks may be granted for illness or disability due to pregnancy or confinement. Maternity leave pay is generally 4/5 of average daily wages; pay for the 11th to 14th weeks is capped at HK$80,000. To get paid maternity leave, you normally need at least 40 weeks’ continuous employment immediately before the leave starts, plus the required pregnancy notice.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 107,
    "topic": "Paternity leave",
    "category": "cap57",
    "triggers": [
      "paternity leave",
      "father leave",
      "paternity pay"
    ],
    "answer": "An eligible male employee under a continuous contract gets 5 days of paternity leave for each confinement of his spouse/partner. You may take the 5 days together or separately, from 4 weeks before the expected delivery date to 14 weeks after the actual birth. To get paternity leave pay (4/5 of average daily wages), you normally need at least 40 weeks’ continuous employment immediately before the leave day, plus the required documents. Give notice at least 3 months before the expected delivery (or at least 5 days before the leave date if that advance notice was not given).",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 108,
    "topic": "Statutory holidays",
    "category": "cap57",
    "triggers": [
      "statutory holiday",
      "statutory holidays",
      "public holiday pay",
      "holiday entitlement under law"
    ],
    "answer": "Every employee covered by Cap. 57 is entitled to statutory holidays (not just continuous-contract staff). Current holidays include: 1 January, Lunar New Year Days 1–3, Ching Ming, Labour Day, Buddha’s Birthday, Tuen Ng, HKSAR Establishment Day, the day after Mid-Autumn, National Day, Chung Yeung, Winter Solstice or Christmas (employer’s choice), and the first weekday after Christmas; Easter Monday is added from 2026. If you must work on a statutory holiday, your employer must give an alternative holiday within 60 days before or after (with at least 48 hours’ prior notice). Holiday pay applies if you have been under a continuous contract for at least 3 months before that holiday. Employers cannot buy out a statutory holiday with cash instead of giving the day off.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 109,
    "topic": "Wages and payday",
    "category": "cap57",
    "triggers": [
      "wage period",
      "when must wages be paid",
      "payday law",
      "payment of wages",
      "unpaid wages",
      "wage payment"
    ],
    "answer": "Wages must be paid as soon as practicable after the end of the wage period, and in any case not later than 7 days after that period ends. On termination, most termination payments (except severance payment) must also be paid within 7 days. Wage deductions are tightly limited (for example for damage/loss, absence, or other legally allowed items) and cannot simply be made at will.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 110,
    "topic": "Termination notice",
    "category": "cap57",
    "triggers": [
      "termination notice",
      "notice period",
      "resignation notice",
      "payment in lieu of notice",
      "dismiss",
      "termination of employment"
    ],
    "answer": "Either side may end the contract by giving notice or payment in lieu of notice. During the first month of probation, no notice is required. After the first month of probation, notice is as agreed in the contract but not less than 7 days. After probation (or if there is no probation): if the contract sets a notice period, follow it but not less than 7 days; if the contract sets no notice period, notice must be at least 1 month. Payment in lieu equals the wages you would have earned during that notice period (using average wages).",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  },
  {
    "id": 111,
    "topic": "Severance and long service",
    "category": "cap57",
    "triggers": [
      "severance payment",
      "long service payment",
      "redundancy",
      "lsp",
      "severance"
    ],
    "answer": "Severance payment: available if you have at least 24 months under a continuous contract and are dismissed by redundancy, laid off, or your fixed-term contract is not renewed due to redundancy. Long service payment: available after at least 5 years under a continuous contract in the qualifying termination situations. For a monthly-paid employee, the usual rate is 2/3 × last month’s wages × years of service. Last month’s wages used in the formula are capped at HK$22,500, so the yearly unit is capped at HK$15,000, and the total payment is capped at HK$390,000. Severance must be paid within 2 months after the employer receives your written claim.",
    "source": "Employment Ordinance Cap. 57",
    "sourceUrl": "https://www.elegislation.gov.hk/hk/cap57"
  }
];

    const messagesEl = document.getElementById("messages");
    const questionEl = document.getElementById("question");
    const askBtn = document.getElementById("askBtn");

    function wantsCap57(q) {
      return /(employment ordinance|cap\.?\s*57|chapter\s*57|statutory|hong kong law|hk law|labour law|labor law)/i.test(q);
    }

    function findAnswer(raw) {
      const q = raw.toLowerCase().trim();
      const preferCap57 = wantsCap57(q);
      let best = null;
      let bestScore = 0;
      for (const item of knowledge) {
        let score = 0;
        for (const trigger of item.triggers) {
          if (q.includes(trigger)) score += trigger.length;
        }
        if (preferCap57 && item.category === "cap57" && score > 0) score += 50;
        if (score > bestScore) {
          bestScore = score;
          best = item;
        }
      }
      return best;
    }

    function addBubble(text, role, source, sourceUrl) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.appendChild(document.createTextNode(text));
      if (source) {
        bubble.appendChild(document.createElement("br"));
        if (sourceUrl) {
          const link = document.createElement("a");
          link.className = "source";
          link.href = sourceUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Source: " + source;
          bubble.appendChild(link);
        } else {
          const tag = document.createElement("div");
          tag.className = "source";
          tag.textContent = "Source: " + source;
          bubble.appendChild(tag);
        }
      }
      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function ask() {
      const text = questionEl.value.trim();
      if (!text) return;

      addBubble(text, "user");
      questionEl.value = "";

      const match = findAnswer(text);
      if (match) {
        addBubble(match.answer, "bot", match.source, match.sourceUrl);
      } else {
        addBubble(
          "I don't know that one from the sample knowledge yet. Try asking about rest days, annual leave, sickness allowance, maternity/paternity leave, statutory holidays, wages, notice, or severance.",
          "bot",
          "Employment Ordinance Cap. 57",
          CAP57_URL
        );
      }
    }

    addBubble(
      "Hi! Ask a Cap. 57 question and I will give the concrete rule (days, pay rate, eligibility). The source link is only for reference.",
      "bot"
    );

    askBtn.addEventListener("click", ask);
    questionEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        ask();
      }
    });
  </script>
</body>
</html>
